# Cloudflare Worker that proxies setlist.fm (see worker/worker.js).
# Deployed by .github/workflows/worker.yml. The setlist.fm API key is a
# dashboard secret (SETLISTFM_API_KEY); never define it here, deploys keep it.
name = "setlist-proxy"
main = "worker/worker.js"
compatibility_date = "2025-01-01"
workers_dev = true

# Not secret: the only Spotify account the live history tracker serves.
# Keep secrets (SETLISTFM_API_KEY, LASTFM_API_KEY) out of [vars]; they live in the dashboard.
[vars]
OWNER_SPOTIFY_ID = "118489613"
# Public PKCE client ID (also in src/auth.ts); the tracker refreshes tokens with it.
SPOTIFY_CLIENT_ID = "bde1387dee44433ab2311f114c7eae93"

# Live history tracker: hourly, off the hour.
[triggers]
crons = ["23 * * * *"]
